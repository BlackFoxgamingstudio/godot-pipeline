version: "3.9"
# Sovereign Godot Pipeline — docker-compose
# Usage: docker-compose up --build

services:
  godot-pipeline:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: sovereign-godot-pipeline:latest
    container_name: sovereign-godot-pipeline
    restart: unless-stopped
    ports:
      - "8786:8786"
    environment:
      SBB_GODOT_BIN_PATH: ${SBB_GODOT_BIN_PATH}
      SBB_EXPORT_PRESETS: ${SBB_EXPORT_PRESETS}
      SBB_ITCH_IO_TOKEN: ${SBB_ITCH_IO_TOKEN}
      SBB_GUT_SCENE_PATH: ${SBB_GUT_SCENE_PATH}
      SBB_API_KEY: ${SBB_API_KEY:-change-me}
      SBB_N8N_EVENT_BUS_URL: ${SBB_N8N_EVENT_BUS_URL:-http://host.docker.internal:5678/webhook/event-bus}
      SERVICE_PORT: 8786
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./.data:/app/.data:rw
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8786/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - sbb-platform

networks:
  sbb-platform:
    external: true
    name: sbb-platform-network
